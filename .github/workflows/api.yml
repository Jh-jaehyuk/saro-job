name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sarojob
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sarojob"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sarojob
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install workspace (all packages)
        run: uv sync --all-packages --frozen

      - name: Lint (ruff)
        run: uv run ruff check apps/api

      - name: Format check (ruff)
        run: uv run ruff format --check apps/api

      - name: Type check (mypy --strict)
        run: uv run mypy --strict apps/api/app

      - name: Run Alembic migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest apps/api/tests -v
