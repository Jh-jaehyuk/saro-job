name: worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "apps/api/app/tasks/**"
      - "apps/api/app/services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "apps/worker/**"
      - "apps/api/app/tasks/**"
      - "apps/api/app/services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/worker.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install workspace (all packages)
        run: uv sync --all-packages --frozen

      - name: Lint (ruff)
        run: uv run ruff check apps/worker

      - name: Format check (ruff)
        run: uv run ruff format --check apps/worker

      - name: Type check (mypy --strict)
        run: uv run mypy --strict apps/worker

      - name: Tests
        run: uv run pytest apps/worker/tests -v
