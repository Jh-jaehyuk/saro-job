[project]
name = "saro-job-api"
version = "0.0.1"
description = "saro-job FastAPI backend"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.13,<2.0",
  "pgvector>=0.3,<1.0",
  "structlog>=24.4,<25.0",
  "fastapi-users[sqlalchemy,oauth]>=14,<15",
  "httpx-oauth>=0.16,<1",
  "boto3>=1.35,<2",
  "pdfplumber>=0.11,<1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
