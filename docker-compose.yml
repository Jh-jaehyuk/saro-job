# 로컬 개발용 인프라.
#
# 기본 프로필(default): postgres만 — 마이그레이션 검증·간단한 DB 작업.
# 통합 프로필(integration): postgres + redis + minio — ARQ·SSE·PDF 업로드 통합 테스트.
#
# 사용:
#   docker compose up -d                                  # postgres만 (default)
#   docker compose --profile integration up -d            # 전체 스택
#   docker compose down                                   # 컨테이너만 정지
#   docker compose down -v                                # 데이터 볼륨까지 제거
#
# 모든 서비스는 CPU·메모리 한도를 명시한다 — macOS Docker Desktop의 자원 누적을 막기 위함.
# healthcheck 간격은 30s로 완화(시작 직후만 자주 폴링).

name: sarojob

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sarojob
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sarojob"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    profiles: ["", "integration"]  # default + integration

  redis:
    image: redis:7-alpine
    # 호스트의 6379가 다른 컨테이너에 의해 점유될 수 있어 6380으로 노출한다.
    # 컨테이너 내부는 그대로 6379. `.env`의 REDIS_URL은 localhost:6380을 가리킨다.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    profiles: ["integration"]

  minio:
    image: minio/minio:latest
    # 콘솔(9001)은 비활성화하지 않는다(개발 편의). 무거우면 `--console-address ""`로 끌 수 있음.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    profiles: ["integration"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
