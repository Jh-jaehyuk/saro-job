[project]
name = "saro-job"
version = "0.0.1"
description = "AI 이력서·JD 매칭과 맞춤형 면접 질문 자동 생성기 — monorepo root"
requires-python = "==3.12.*"

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[dependency-groups]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "boto3-stubs[s3]>=1.35,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["apps/api", "apps/worker"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests"]
# 두 워크스페이스의 tests/ 디렉토리가 같은 이름을 갖기 때문에 importlib 모드로
# 패키지 이름 충돌을 회피한다. tests/는 __init__.py 없이 운영한다.
# pythonpath: worker.py는 비패키지(스크립트)라 apps/worker를 sys.path에 추가해야
# `from worker import WorkerSettings`가 동작한다.
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["apps/worker"]
